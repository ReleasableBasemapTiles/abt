name: abtv2
channels:
  - conda-forge
dependencies:
  - python=3.13
  - gdal
  - numpy
  - pyproj
  # Explicit floor, not just whatever gdal/pyproj happen to pull in: PROJ
  # 9.8.0 added the ellipsoidal Equidistant Cylindrical method (EPSG:1028,
  # https://github.com/OSGeo/PROJ/issues/4654), which is what makes this
  # env's ogr2ogr/pyproj agree with PostGIS's own ST_Transform for
  # EPSG:4087-style codes -- see rbt-schema/scripts/overture/README.md and
  # check_proj_agreement.py, which verifies this agreement at runtime.
  - proj>=9.8
  - psycopg2
  - boto3
  - pydantic
  - requests
  - click
  - typer
  - rich
  - pyyaml
  - tqdm
  - libgdal-arrow-parquet
  - libgdal
  - beautifulsoup4
  # Overture aux sources: DuckDB reads the filtered rows straight from the
  # public S3 bucket and writes the FlatGeobuf that ogr2ogr imports (see
  # DownloadOverture). 1.1+ reads GeoParquet geometry as GEOMETRY. Its
  # spatial/httpfs extensions are fetched from extensions.duckdb.org at
  # first use.
  - python-duckdb>=1.1
  - pytest

