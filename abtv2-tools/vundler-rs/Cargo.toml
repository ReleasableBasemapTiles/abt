[package]
name = "abt-vundler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
indicatif = "0.18.6"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
