# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}

"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
/compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
/releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_parsers = [
    { message = "(?i)^chore\\(changelog\\)", skip = true },
    { message = "(?i)^chore\\(release\\)", skip = true },
    { message = "^Merge ", skip = true },
    { body = ".*security", group = "Security" },
    { message = "(?i)^feat", group = "Added" },
    { message = "(?i)^fix", group = "Fixed" },
    { message = "(?i)^doc", group = "Changed" },
    { message = "(?i)^perf", group = "Changed" },
    { message = "(?i)^refactor", group = "Changed" },
    { message = "(?i)^style", group = "Changed" },
    { message = "(?i)^test", group = "Changed" },
    { message = "(?i)^build", group = "Changed" },
    { message = "(?i)^ci", group = "Changed" },
    { message = "(?i)^chore", group = "Changed" },
    { message = "(?i)^revert", group = "Changed" },
    { message = "^[aA]dd", group = "Added" },
    { message = "^[sS]upport", group = "Added" },
    { message = "^[rR]emove", group = "Removed" },
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^.*: fix", group = "Fixed" },
    { message = ".*", group = "Changed" },
]

[remote.github]
owner = "ReleasableBasemapTiles"
repo = "abt"
