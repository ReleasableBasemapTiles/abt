  island_polygon:
    type: polygon
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: geometry
    - name: area
      type: area
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: rank
      key: rank
      type: integer
    - name: tags
      type: hstore_tags
    filters:
      require:
        name:
        - __any__
    mapping:
      place:
      - island
      - islet
