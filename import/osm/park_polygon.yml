  park_polygon:
    type: polygon
    _resolve_wikidata: false
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: validated_geometry
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: class
      type: mapping_key
    - name: subclass
      type: mapping_value
    - name: landuse
      key: landuse
      type: string
    - name: leisure
      key: leisure
      type: string
    - name: boundary
      key: boundary
      type: string
    - name: surface
      key: surface
      type: string
    - name: ownership
      key: ownership
      type: string
    - name: owner
      key: owner
      type: string
    - name: operator
      key: operator
      type: string
    - name: access
      key: access
      type: string
    - name: protection_title
      key: protection_title
      type: string
    - name: protect_class
      key: protect_class
      type: string
    - name: iucn_level
      key: iucn_level
      type: string
    - name: area
      type: area
    - name: tags
      type: hstore_tags
    mapping:
      leisure:
        - nature_reserve
        - park
        - golf_course
        - dog_park
        - recreation_ground
        - garden
      boundary:
        - national_park
        - protected_area
        - aboriginal_lands
      landuse:
        - recreation_ground
      golf:
      - bunker
      - green
      - fairway
      park:type:
      - __any__
