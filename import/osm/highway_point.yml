  highway_point:
    type: point
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: geometry
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: class
      type: mapping_key
    - name: subclass
      type: mapping_value
    - name: ref
      key: ref
      type: string
    - name: layer
      key: layer
      type: integer
    - name: level
      key: level
      type: integer
    - name: tags
      type: hstore_tags
    mapping:
      highway:
      - motorway_junction