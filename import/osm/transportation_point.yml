transportation_point:
    type: point
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: geometry
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: class
      type: mapping_key
    - name: subclass
      type: mapping_value
    - name: ref
      key: ref
      type: string
    - name: network
      key: network
      type: string
    - name: operator
      key: operator
      type: string
    - name: uic_ref
      key: uic_ref
      type: string
    - name: station
      key: station
      type: string
    - name: funicular
      key: funicular
      type: string
    - name: platforms
      key: platforms
      type: string
    - name: service
      key: service
      type: string
    - name: usage
      key: usage
      type: string
    - name: yard_size
      key: railway:yard:size
      type: string
    - name: yard_purpose
      key: railway:yard:purpose
      type: string
    - name: layer
      key: layer
      type: integer
    - name: level
      key: level
      type: integer
    - name: is_indoor
      key: indoor
      type: bool
    - name: tags
      type: hstore_tags
    mapping:
      railway:
      - halt
      - station
      - subway_entrance
      - train_station_entrance
      - tram_stop
      - yard
      highway:
      - bus_stop
      amenity:
      - bus_station
      - ferry_terminal
      aerialway:
      - station
      public_transport:
      - platform
      - station
      - stop_position