# Enforce Conventional Commits on pull request titles and on commits
# in the PR. git-cliff groups those messages into CHANGELOG.md.

name: Lint PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          helpURL: https://github.com/ReleasableBasemapTiles/abt/blob/main/CONTRIBUTING.md
