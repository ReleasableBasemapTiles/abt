name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # docs/_hooks/*.py import or read these at build time (CLI reference,
      # layer registry, data sources, carto execution graph, database
      # schema), so a change here can break -- or silently go stale in --
      # the docs build even with no docs/ edit.
      - "abtv2-tools/**"
      - "rbt-schema/export/**"
      - "rbt-schema/import/aux_data/**"
      - "rbt-schema/tile-metadata/**"
      - "rbt-schema/carto_sql/**"

permissions:
  contents: read

# One docs run at a time per ref. Pull requests cancel an older run when a
# newer push arrives. Pushes to main do not: cancelling an in-progress run
# would abort a Pages deploy that is already publishing.
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date-localized-plugin needs full history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            abtv2-tools/requirements-dev.txt
      - name: Install docs dependencies
        run: |
          pip install -r requirements-docs.txt
          # docs/_hooks/gen_cli_reference.py imports abt-tools.py's Typer app
          # at build time, which needs abtv2-tools/abt importable -- same
          # dependency set as its own test suite.
          pip install -r abtv2-tools/requirements-dev.txt
      - name: Build site
        run: mkdocs build --strict
      # Pull requests keep a downloadable copy of the built site. Pushes to
      # main publish it to GitHub Pages instead
      # (https://ReleasableBasemapTiles.github.io/abt/).
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: docs-site
          path: site/
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
