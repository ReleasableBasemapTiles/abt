name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # docs/_hooks/*.py import or read these at build time (CLI reference,
      # layer registry, data sources, carto execution graph), so a change
      # here can break -- or silently go stale in -- the docs build even
      # with no docs/ edit.
      - "abtv2-tools/**"
      - "rbt-schema/export/**"
      - "rbt-schema/import/aux_data/**"
      - "rbt-schema/tile-metadata/**"
      - "rbt-schema/carto_sql/execution_plan.yml"

permissions:
  contents: read

# Only one docs build runs at a time per ref/PR, so two pushes in quick
# succession don't race each other's artifact upload.
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date-localized-plugin needs full history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            abtv2-tools/requirements-dev.txt
      - name: Install docs dependencies
        run: |
          pip install -r requirements-docs.txt
          # docs/_hooks/gen_cli_reference.py imports abt-tools.py's Typer app
          # at build time, which needs abtv2-tools/abt importable -- same
          # dependency set as its own test suite.
          pip install -r abtv2-tools/requirements-dev.txt
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

# --- GitHub Pages deploy: intentionally not wired up yet --------------------
#
# ReleasableBasemapTiles/abt is a private repository under a GitHub Free
# organization plan. GitHub Pages can only be published from a *public*
# repository on that plan -- see "GitHub Pages in public repositories" under
# GitHub Free in
# https://docs.github.com/en/get-started/learning-about-github/githubs-plans.
# So for now, every push/PR only builds and `--strict`-validates the site
# (job above) and uploads it as a downloadable Actions artifact; nothing is
# published externally.
#
# To publish it, pick one:
#   1. Make this repository public (matches
#      github.com/mjj203/rbt-data-generator, the reference this setup is
#      based on).
#   2. Upgrade the ReleasableBasemapTiles org to GitHub Team or GitHub
#      Enterprise Cloud, which allows *privately published* Pages sites
#      (readable only by repo/org members) even while this repo stays
#      private -- see
#      https://docs.github.com/en/pages/getting-started-with-github-pages/changing-the-visibility-of-your-github-pages-site
#      -- and set the Pages site visibility to "private" in repo Settings >
#      Pages once enabled.
#   3. Push the built `site/` directory to a separate *public* docs repo
#      (e.g. ReleasableBasemapTiles/abt-docs) instead of publishing this
#      repo's own Pages site. Keeps the code repo private with no plan
#      change, at the cost of a second repo to manage.
#
# Once you've picked option 1 or 2 above:
#   - add `pages: write` and `id-token: write` to the `permissions:` block
#     above
#   - replace the last step of `build` (`actions/upload-artifact@v4`) with:
#       - uses: actions/configure-pages@v5
#       - uses: actions/upload-pages-artifact@v5
#         with:
#           path: site/
#   - add a `deploy` job:
#       deploy:
#         if: github.ref == 'refs/heads/main'
#         needs: build
#         runs-on: ubuntu-latest
#         environment:
#           name: github-pages
#           url: ${{ steps.deployment.outputs.page_url }}
#         steps:
#           - id: deployment
#             uses: actions/deploy-pages@v5
