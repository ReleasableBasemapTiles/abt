# Regenerate CHANGELOG.md from Conventional Commits via git-cliff.
# Runs on pushes to main and on v* tags. Bot commits use
# `chore(changelog): ... [skip ci]` so this workflow does not loop.

name: Changelog

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --offline
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md is already up to date"
            exit 0
          fi
          git commit -m "chore(changelog): update CHANGELOG.md [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
