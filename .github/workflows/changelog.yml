# Regenerate CHANGELOG.md from Conventional Commits via git-cliff.
# Runs on pushes to main, on v* tags, and when a release is published. Bot
# commits use `chore(changelog): ... [skip ci]` so this workflow does not loop.
#
# The release trigger is there because the tag trigger can't be relied on. The
# tip of main is usually the bot's own `[skip ci]` commit, and a tag pushed
# onto it starts no run at all, because GitHub skips a push event whose head
# commit says [skip ci]. That is how v2.2.1 was cut, and its CHANGELOG.md
# section wasn't written until a later push to main. A release event isn't
# subject to [skip ci]. A release cut with `gh release create` fires both
# triggers when its tag lands on an ordinary commit; the second run finds
# nothing to change and exits.

name: Changelog

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --offline
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md is already up to date"
            exit 0
          fi
          git commit -m "chore(changelog): update CHANGELOG.md [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
